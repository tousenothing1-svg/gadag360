<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GADAG 360 Delivery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;color:#1a1a1a}
:root{--green:#1A6B3C;--red:#E53935;--orange:#FF6B35;--line:#e0e0e0}
.header{background:var(--green);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:800}
.btn{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:700}
.btn-green{background:var(--green);color:white}
.btn-red{background:var(--red);color:white}
.btn-gray{background:#f0f0f0;color:#555}
.btn-orange{background:var(--orange);color:white}
.btn-sm{padding:6px 12px;font-size:12px}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1A6B3C,#2d9e5f);padding:20px}
.login-box{background:white;border-radius:20px;padding:32px;width:100%;max-width:360px}
.login-logo{font-size:26px;font-weight:900;color:var(--green);margin-bottom:4px}
label{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px;margin-top:14px}
input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;outline:none}
.order-card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.order-card.delivered{opacity:0.6;border-left:4px solid var(--green)}
.order-card.pickedup{border-left:4px solid var(--orange)}
.order-card.assigned{border-left:4px solid #2196F3}
.badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.badge-blue{background:#e3f2fd;color:#1565C0}
.badge-orange{background:#fff3e0;color:#E65100}
.badge-green{background:#e8f5e9;color:var(--green)}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid #f0f0f0;border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:12px;color:white;font-size:14px;font-weight:600;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,0.2);white-space:nowrap}
.empty{text-align:center;padding:60px 20px;color:#aaa}
.empty-icon{font-size:48px;margin-bottom:12px}
.section-title{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1A6B3C,#2d9e5f);padding:20px">
  <div style="background:white;border-radius:20px;padding:32px;width:100%;max-width:360px">
    <div style="font-size:26px;font-weight:900;color:var(--green)">🛵 GADAG 360</div>
    <div style="color:#888;font-size:13px;margin-bottom:8px">Delivery Panel</div>
    <label>Delivery Boy ID</label>
    <input id="dbId" placeholder="e.g. db1" onkeydown="if(event.key==='Enter')doLogin()"/>
    <label>Password</label>
    <input type="password" id="dbPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <div id="loginError" style="color:var(--red);font-size:12px;margin-top:8px"></div>
    <button class="btn btn-green" style="width:100%;padding:13px;margin-top:18px;font-size:15px" onclick="doLogin()">Login</button>
  </div>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none">
  <div class="header">
    <h1>🛵 My Orders</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="boyName" style="font-size:13px;opacity:0.85"></span>
      <button class="btn btn-gray btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>

  <div style="padding:16px;max-width:600px;margin:0 auto">
    <div style="display:flex;gap:10px;margin-bottom:16px">
      <button class="btn btn-green btn-sm" onclick="loadMyOrders()" style="flex:1">🔄 Refresh</button>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px">
      <div style="background:white;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)">
        <div style="font-size:22px;font-weight:800;color:#2196F3" id="statAssigned">0</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Assigned</div>
      </div>
      <div style="background:white;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)">
        <div style="font-size:22px;font-weight:800;color:var(--orange)" id="statPickedup">0</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Picked Up</div>
      </div>
      <div style="background:white;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)">
        <div style="font-size:22px;font-weight:800;color:var(--green)" id="statDelivered">0</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Delivered</div>
      </div>
    </div>

    <div id="ordersContainer"><div style="text-align:center;padding:40px"><span class="spinner"></span> Loading orders...</div></div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
const URL = "https://lykhjuizzvurklywxflz.supabase.co/rest/v1";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2hqdWl6enZ1cmtseXd4Zmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODg3OTMsImV4cCI6MjEwNjk2NDc5M30.2gO3aK030mJ0pYTeMd95B7uZF-dHnFzDOSaPwt9hZ6Q";
const H = {"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};

let currentBoy = null;

async function db(table, opts={}) {
  const {method="GET", filter="", body=null} = opts;
  const res = await fetch(`${URL}/${table}?${filter}`, {method, headers:H, body:body?JSON.stringify(body):null});
  if(!res.ok) throw new Error(await res.text());
  return method==="DELETE" ? [] : res.json();
}

async function doLogin() {
  const id = document.getElementById("dbId").value.trim();
  const pass = document.getElementById("dbPass").value.trim();
  if(!id || !pass){ document.getElementById("loginError").textContent="Enter ID and password"; return; }
  try {
    const boys = await db("delivery_boys", {filter:`id=eq.${id}`});
    if(!boys || boys.length===0){ document.getElementById("loginError").textContent="Delivery boy ID not found"; return; }
    const boy = boys[0];
    if(boy.password !== pass){ document.getElementById("loginError").textContent="Wrong password"; return; }
    if(!boy.active){ document.getElementById("loginError").textContent="Account inactive. Contact admin."; return; }
    currentBoy = boy;
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("mainApp").style.display="block";
    document.getElementById("boyName").textContent = boy.name;
    loadMyOrders();
  } catch(e){ document.getElementById("loginError").textContent="Error: "+e.message; }
}

function logout(){
  currentBoy=null;
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("mainApp").style.display="none";
  document.getElementById("dbId").value="";
  document.getElementById("dbPass").value="";
}

async function loadMyOrders(){
  document.getElementById("ordersContainer").innerHTML='<div style="text-align:center;padding:40px"><span class="spinner"></span> Loading...</div>';
  try {
    const orders = await db("orders", {filter:`delivery_boy_id=eq.${currentBoy.id}&order=created_at.desc`});
    const active = (orders||[]).filter(o=>o.status!=="delivered"&&o.status!=="cancelled");
    const delivered = (orders||[]).filter(o=>o.status==="delivered");
    const pickedup = (orders||[]).filter(o=>o.status==="pickedup");
    const assigned = (orders||[]).filter(o=>o.status!=="delivered"&&o.status!=="cancelled"&&o.status!=="pickedup");

    document.getElementById("statAssigned").textContent = assigned.length;
    document.getElementById("statPickedup").textContent = pickedup.length;
    document.getElementById("statDelivered").textContent = delivered.length;

    if(!orders || orders.length===0){
      document.getElementById("ordersContainer").innerHTML=`<div class="empty"><div class="empty-icon">📦</div><div style="font-weight:700;font-size:16px">No orders assigned yet</div><div style="font-size:13px;margin-top:6px">Check back later</div></div>`;
      return;
    }

    let html = "";
    if(active.length>0){
      html += `<div class="section-title">🔔 Active Orders (${active.length})</div>`;
      html += active.map(o=>renderCard(o)).join("");
    }
    if(delivered.length>0){
      html += `<div class="section-title">✅ Delivered Today (${delivered.length})</div>`;
      html += delivered.map(o=>renderCard(o)).join("");
    }
    document.getElementById("ordersContainer").innerHTML = html;
  } catch(e){
    document.getElementById("ordersContainer").innerHTML=`<div style="color:red;text-align:center;padding:40px">Error: ${e.message}</div>`;
  }
}

function renderCard(o){
  const date = o.created_at ? new Date(o.created_at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "—";
  const statusBadge = o.status==="delivered"
    ? `<span class="badge badge-green">✅ Delivered</span>`
    : o.status==="pickedup"
    ? `<span class="badge badge-orange">🛵 Picked Up</span>`
    : `<span class="badge badge-blue">📋 Assigned</span>`;

  const mapsLink = o.address ? `https://maps.google.com/?q=${encodeURIComponent(o.address)}` : null;

  const actionBtns = o.status==="delivered"||o.status==="cancelled" ? "" : o.status==="pickedup"
    ? `<button class="btn btn-green" style="flex:1" onclick="updateStatus('${o.id}','delivered')">✅ Mark Delivered</button>`
    : `<button class="btn btn-orange" style="flex:1" onclick="updateStatus('${o.id}','pickedup')">🛵 Picked Up</button>`;

  return `<div class="order-card ${o.status==="delivered"?"delivered":o.status==="pickedup"?"pickedup":"assigned"}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-weight:800;font-size:15px">#${o.id}</div>
      ${statusBadge}
    </div>
    <div style="font-size:13px;color:#555;margin-bottom:6px">🕐 ${date}</div>
    <div style="font-size:13px;margin-bottom:4px"><b>📍 Address:</b> ${o.address||"—"}</div>
    <div style="font-size:13px;margin-bottom:4px"><b>💰 Amount:</b> ₹${o.total} (${o.payment==="upi"?"UPI":"COD"})</div>
    ${o.items ? `<div style="font-size:12px;color:#777;margin-bottom:10px">🛒 ${Array.isArray(o.items)?o.items.map(i=>i.name||i).join(", "):o.items}</div>` : ""}
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${actionBtns}
      ${mapsLink ? `<button class="btn btn-gray btn-sm" onclick="window.open('${mapsLink}','_blank')" style="flex:1">🗺️ Navigate</button>` : ""}
      <button class="btn btn-gray btn-sm" onclick="callAdmin()" style="flex:1">📞 Call Admin</button>
    </div>
  </div>`;
}

async function updateStatus(id, status){
  try {
    await fetch(`${URL}/orders?id=eq.${id}`, {method:"PATCH", headers:H, body:JSON.stringify({status})});
    toast(status==="delivered" ? "✅ Order marked as delivered!" : "🛵 Order picked up!", status==="delivered"?"#1A6B3C":"#FF6B35");
    loadMyOrders();
  } catch(e){ toast("Error: "+e.message, "#E53935"); }
}

function callAdmin(){
  // Replace with your actual business number when ready
  const adminNumber = "+919886888924";
  if(confirm("Call admin/owner?")){
    window.location.href = "tel:"+adminNumber;
  }
}

function toast(msg, color="#1A6B3C"){
  const t = document.getElementById("toast");
  t.textContent=msg; t.style.background=color; t.style.display="block";
  setTimeout(()=>t.style.display="none", 3000);
}
</script>
</body>
</html>
