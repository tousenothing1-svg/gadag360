<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Royal Harvest – Delivery Panel</title>
  <!-- installs on riders' phones as its own app (separate from the customer app) -->
  <link rel="manifest" href="/delivery-manifest.json"/>
  <meta name="theme-color" content="#1a7c4a"/>
  <link rel="icon" type="image/png" href="/rider-192.png"/>
  <link rel="apple-touch-icon" href="/rider-180.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="RH Delivery"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f8; min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: #1a7c4a; color: #fff;
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
    .header .sub { font-size: 12px; opacity: .8; margin-top: 2px; }
    .logout-btn { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .logout-btn:hover { background: rgba(255,255,255,.25); }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 32px 24px;
      width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo .icon { font-size: 48px; }
    .login-logo h2 { font-size: 20px; font-weight: 700; color: #1a7c4a; margin-top: 8px; }
    .login-logo p { font-size: 13px; color: #888; margin-top: 4px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 15px; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: #1a7c4a; }
    .login-btn {
      width: 100%; padding: 14px; background: #1a7c4a; color: #fff;
      border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .login-btn:hover { background: #156038; }
    .login-btn:disabled { background: #aaa; cursor: not-allowed; }
    .err-msg { color: #e53935; font-size: 13px; text-align: center; margin-top: 10px; }

    /* ── MAIN PANEL ── */
    #mainPanel { display: none; }
    .tabs {
      display: flex; background: #fff; border-bottom: 1px solid #e0e0e0;
      position: sticky; top: 60px; z-index: 9;
    }
    .tab {
      flex: 1; text-align: center; padding: 12px 4px; font-size: 13px; font-weight: 600;
      color: #888; cursor: pointer; border-bottom: 3px solid transparent; transition: all .2s;
    }
    .tab.active { color: #1a7c4a; border-bottom-color: #1a7c4a; }
    .tab .badge {
      display: inline-block; background: #e53935; color: #fff;
      border-radius: 10px; font-size: 11px; padding: 1px 6px; margin-left: 4px;
    }

    .section { display: none; padding: 16px; }
    .section.active { display: block; }

    /* ── ORDER CARD ── */
    .order-card {
      background: #fff; border-radius: 14px; margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07); overflow: hidden;
    }
    .order-card-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f0f0f0;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .order-id { font-size: 15px; font-weight: 700; color: #111; }
    .order-time { font-size: 12px; color: #999; margin-top: 2px; }
    .status-badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .status-placed { background: #fff3e0; color: #e65100; }
    .status-picked { background: #e3f2fd; color: #1565c0; }
    .status-delivered { background: #e8f5e9; color: #1b5e20; }

    .order-items { padding: 12px 16px; }
    .order-items .item-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
    .item-name { color: #333; }
    .item-qty { color: #666; font-weight: 600; }

    .order-footer { padding: 12px 16px; background: #fafafa; border-top: 1px solid #f0f0f0; }
    .order-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .meta-pill {
      font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600;
    }
    .meta-total { background: #e8f5e9; color: #1b5e20; }
    .meta-payment { background: #f3e5f5; color: #6a1b9a; }
    .meta-slot { background: #e3f2fd; color: #1565c0; }

    .map-links { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .map-btn {
      flex: 1; min-width: 140px; text-decoration: none; display: flex; align-items: center;
      justify-content: center; gap: 6px; padding: 10px 12px; border-radius: 10px;
      font-size: 13px; font-weight: 600; border: none; cursor: pointer;
    }
    .map-pickup { background: #fff8e1; color: #f57f17; border: 1.5px solid #ffe082; }
    .map-pickup:hover { background: #fff3cd; }
    .map-drop { background: #e8f5e9; color: #1b5e20; border: 1.5px solid #a5d6a7; }
    .map-drop:hover { background: #dcedc8; }
    .map-drop.no-gps { background: #f5f5f5; color: #999; border-color: #e0e0e0; cursor: default; }

    .address-text { font-size: 13px; color: #555; margin-bottom: 10px; line-height: 1.4; }

    .action-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .btn-pickup { background: #1565c0; color: #fff; }
    .btn-pickup:hover { background: #0d47a1; }
    .btn-deliver { background: #1a7c4a; color: #fff; }
    .btn-deliver:hover { background: #156038; }
    .btn-done { background: #f5f5f5; color: #aaa; cursor: default; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    /* ── LOADING ── */
    .loading { text-align: center; padding: 40px; color: #888; font-size: 14px; }

    /* ── REFRESH BTN ── */
    .refresh-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .refresh-btn {
      background: #fff; border: 1.5px solid #ddd; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; font-weight: 600; color: #444;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .refresh-btn:hover { background: #f5f5f5; }

    /* ── STATS ── */
    .stats-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .stat-box {
      flex: 1; background: #fff; border-radius: 12px; padding: 14px 12px;
      text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }
    .stat-num { font-size: 24px; font-weight: 800; color: #1a7c4a; }
    .stat-label { font-size: 11px; color: #888; margin-top: 2px; font-weight: 600; }

    /* ── INSTALL BAR + LIVE LOCATION STRIP ── */
    .install-bar { display: none; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50;
      align-items: center; gap: 10px; background: #fff8e6; border: 1.5px solid #f2b53a; color: #5a4300;
      border-radius: 14px; padding: 10px 10px 10px 12px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.15);
      max-width: 480px; margin: 0 auto; }
    .install-bar.show { display: flex; }
    .install-bar img { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; }
    .install-bar .txt { flex: 1; line-height: 1.35; }
    .install-bar .go { background: #1a7c4a; color: #fff; border: 0; border-radius: 9px; padding: 9px 14px;
      font-size: 13px; font-weight: 700; cursor: pointer; }
    .install-bar .x { background: none; border: 0; color: #8a7a50; padding: 6px 8px; font-size: 16px; cursor: pointer; }
    .live-strip { display: none; background: #e8f5ee; color: #1a7c4a; font-size: 12.5px; font-weight: 600;
      padding: 8px 14px; text-align: center; border-bottom: 1px solid #cfe9da; }
    .live-strip.show { display: block; }
    /* ── ORDER ALERTS ── */
    .alert-strip { display: none; align-items: center; gap: 10px; background: #fff8e6; color: #5a4300; font-size: 13px;
      padding: 10px 14px; border-bottom: 1px solid #f2dca0; line-height: 1.4; }
    .alert-strip.show { display: flex; }
    .alert-strip.on { background: #e8f5ee; color: #1a7c4a; border-bottom-color: #cfe9da; font-weight: 600; font-size: 12.5px;
      padding: 7px 14px; justify-content: center; text-align: center; }
    .alert-strip .txt { flex: 1; }
    .alert-strip button { background: #1a7c4a; color: #fff; border: 0; border-radius: 9px; padding: 10px 14px; font-size: 13px;
      font-weight: 700; cursor: pointer; white-space: nowrap; }
    .alert-strip button:disabled { opacity: .7; cursor: default; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">🛵</div>
      <h2>Royal Harvest</h2>
      <p>Delivery Partner Login</p>
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="loginPhone" placeholder="9876543210" inputmode="numeric"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter your password"/>
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="err-msg" id="loginErr"></div>
  </div>
</div>

<!-- MAIN PANEL -->
<div id="mainPanel">
  <div class="header">
    <div>
      <div class="h1" style="font-size:17px;font-weight:700;" id="headerName">🛵 Delivery Panel</div>
      <div class="sub" id="headerSub">Royal Harvest</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
  <div class="live-strip" id="liveStrip" role="status">📍 Sharing your live location with the customer. Keep this app open on your screen.</div>
  <div class="alert-strip" id="alertStrip" role="region" aria-label="Order alerts">
    <div class="txt" id="alertTxt"></div>
    <button id="alertBtn" onclick="turnOnOrderAlerts()">Turn on</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-active" onclick="switchTab('active')">
      Active <span class="badge" id="activeBadge" style="display:none">0</span>
    </div>
    <div class="tab" id="tab-done" onclick="switchTab('done')">Delivered</div>
  </div>

  <div class="section active" id="section-active">
    <div class="stats-row" id="statsRow" style="display:none">
      <div class="stat-box"><div class="stat-num" id="statToday">0</div><div class="stat-label">Today</div></div>
      <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
      <div class="stat-box"><div class="stat-num" id="statEarnings">₹0</div><div class="stat-label">Today's ₹</div></div>
    </div>
    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
    </div>
    <div id="activeOrders"><div class="loading">Loading orders…</div></div>
  </div>

  <div class="section" id="section-done">
    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
    </div>
    <div id="doneOrders"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- INSTALL AS AN APP -->
<div class="install-bar" id="installBar" role="region" aria-label="Install the delivery app">
  <img src="/rider-192.png" alt=""/>
  <div class="txt" id="installTxt"><b>Install the delivery app</b><br>Opens full screen from your home screen.</div>
  <button class="go" id="installBtn" onclick="installApp()">Install</button>
  <button class="x" onclick="hideInstall(true)" aria-label="Not now">✕</button>
</div>

<script>
const SUPABASE_URL = "https://lykhjuizzvurklywxflz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5a2hqdWl6enZ1cmtseXd4Zmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODg3OTMsImV4cCI6MjEwNjk2NDc5M30.2gO3aK030mJ0pYTeMd95B7uZF-dHnFzDOSaPwt9hZ6Q";

// Riders reach orders only through these database functions, with the session token from login.
// The database checks the token and shows a rider only the orders assigned to them.
async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
// A call that needs the login: if the login has ended, go back to the login screen
async function call(fn, args) {
  const r = await rpc(fn, { p_token: currentDeliveryBoy && currentDeliveryBoy.token, ...args });
  if (r && r.ok === false && r.error === "session") { doLogout("Your login has ended. Please log in again."); throw new Error("session"); }
  return r;
}
// Customer text (addresses, product names) is shown as text, never as page code
const esc = s => String(s ?? "").replace(/[&<>"'`]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));

// ── WAREHOUSE LOCATION ──
const WAREHOUSE = {
  lat: 15.426861,
  lon: 75.614917,
  name: "Royal Harvest Warehouse"
};
const WAREHOUSE_MAP = `https://maps.google.com/?q=${WAREHOUSE.lat},${WAREHOUSE.lon}`;

let currentDeliveryBoy = null; // { id, name, token }
let refreshTimer = null;
try { localStorage.removeItem("gd360_db"); } catch (e) {} // the old login kept the whole row here, password included

// ── AUTH ──
async function doLogin() {
  const phone = document.getElementById("loginPhone").value.trim();
  const pass  = document.getElementById("loginPass").value;
  const btn   = document.getElementById("loginBtn");
  const err   = document.getElementById("loginErr");
  err.textContent = "";
  if (!phone || !pass) { err.textContent = "Enter phone and password"; return; }
  btn.disabled = true; btn.textContent = "Logging in…";
  let r = null;
  try { r = await rpc("staff_login", { p_phone: phone, p_password: pass, p_kind: "rider" }); } catch (e) {}
  btn.disabled = false; btn.textContent = "Login";
  if (!r) { err.textContent = "Couldn't reach the server. Check your internet."; return; }
  if (!r.ok) { err.textContent = r.error === "locked" ? "Too many wrong tries. Wait 15 minutes." : "❌ Wrong phone or password"; return; }
  currentDeliveryBoy = { id: r.id, name: r.name, token: r.token };
  try { localStorage.setItem("rh_rider", JSON.stringify(currentDeliveryBoy)); } catch (e) {}
  document.getElementById("loginPass").value = "";
  showPanel();
}

function doLogout(msg) {
  const t = currentDeliveryBoy && currentDeliveryBoy.token;
  // logging out: this phone stops getting that rider's order alerts, then the login ends
  if (t && typeof msg !== "string") stopOrderAlerts(t).finally(() => rpc("staff_logout", { p_token: t }).catch(() => {}));
  try { localStorage.removeItem("rh_rider"); } catch (e) {}
  currentDeliveryBoy = null;
  stopRiderTracking();
  clearInterval(refreshTimer);
  document.getElementById("mainPanel").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("loginErr").textContent = typeof msg === "string" ? msg : "";
}

function showPanel() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainPanel").style.display = "block";
  document.getElementById("headerName").textContent = "🛵 " + currentDeliveryBoy.name;
  loadOrders();
  showAlertStrip();
  refreshOrderAlerts();
  // Auto-refresh every 60 seconds
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadOrders, 60000);
}

// ── ORDERS ──
async function loadOrders() {
  if (!currentDeliveryBoy) return;
  let r = null;
  try { r = await call("rider_orders", {}); } catch (e) { if (e.message === "session") return; }
  const orders = r && r.ok ? r.orders : null;

  if (!orders) {
    document.getElementById("activeOrders").innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>Could not load orders</p></div>`;
    return;
  }

  const active    = orders.filter(o => !["delivered","cancelled"].includes(o.status));
  const delivered = orders.filter(o => o.status === "delivered");

  // Stats
  const today = new Date().toLocaleDateString("en-IN");
  const todayDelivered = delivered.filter(o => new Date(o.created_at).toLocaleDateString("en-IN") === today);
  const todayEarnings  = todayDelivered.reduce((s, o) => s + (o.delivery_fee || 0), 0);
  document.getElementById("statToday").textContent    = todayDelivered.length;
  document.getElementById("statTotal").textContent    = delivered.length;
  document.getElementById("statEarnings").textContent = "₹" + todayEarnings;
  document.getElementById("statsRow").style.display   = delivered.length > 0 ? "flex" : "none";

  // Badge
  if (active.length > 0) {
    document.getElementById("activeBadge").textContent    = active.length;
    document.getElementById("activeBadge").style.display  = "inline-block";
  } else {
    document.getElementById("activeBadge").style.display = "none";
  }

  // Share location for every order on the way, also after the app was closed and opened again
  const enRoute = active.filter(o => o.status === "pickedup" || o.status === "picked_up").map(o => o.id);
  enRoute.forEach(id => startRiderTracking(id));
  [...trackingIds].forEach(id => { if (!enRoute.includes(id)) stopRiderTracking(id); });

  renderOrders("activeOrders", active, true);
  renderOrders("doneOrders",   delivered, false);
}

function renderOrders(containerId, orders, isActive) {
  const el = document.getElementById(containerId);
  if (!orders.length) {
    el.innerHTML = `<div class="empty"><div class="icon">${isActive ? "✅" : "📦"}</div><p>${isActive ? "No active orders right now" : "No delivered orders yet"}</p></div>`;
    return;
  }
  el.innerHTML = orders.map(o => orderCard(o, isActive)).join("");
}

function orderCard(o, isActive) {
  const items = o.order_items || [];
  const itemRows = items.map(i =>
    `<div class="item-row"><span class="item-name">${esc(i.product_name)}${i.variant ? ` <span style="color:#888">(${esc(i.variant)})</span>` : ""}</span><span class="item-qty">x${esc(i.quantity)} — ₹${esc(i.price * i.quantity)}</span></div>`
  ).join("");

  const statusLabel = { placed: "New Order", confirmed: "Confirmed", pickedup: "Picked Up", picked_up: "Picked Up", delivered: "Delivered", cancelled: "Cancelled" }[o.status] || esc(o.status);
  const statusClass = { placed: "status-placed", confirmed: "status-placed", pickedup: "status-picked", picked_up: "status-picked", delivered: "status-delivered" }[o.status] || "";

  const lat = Number(o.gps_lat), lon = Number(o.gps_lon);
  const dropMap  = o.gps_lat && o.gps_lon && isFinite(lat) && isFinite(lon)
    ? `https://maps.google.com/?q=${lat},${lon}`
    : null;

  const mapsLinks = `
    <div class="map-links">
      <a class="map-btn map-pickup" href="${WAREHOUSE_MAP}" target="_blank" rel="noopener">
        📦 Pickup Point
      </a>
      ${dropMap
        ? `<a class="map-btn map-drop" href="${dropMap}" target="_blank" rel="noopener">🏠 Drop Location</a>`
        : `<span class="map-btn map-drop no-gps">📝 Address Only</span>`
      }
    </div>
  `;

  const addressLine = o.address && o.address !== "GPS location pinned ✓" && o.address !== "GPS ಸ್ಥಳ ಪಿನ್ ಮಾಡಲಾಗಿದೆ ✓"
    ? `<div class="address-text">📍 ${esc(o.address)}</div>` : "";

  let actionBtn = "";
  if (isActive) {
    if (o.status === "placed" || o.status === "confirmed") {
      actionBtn = `<button class="action-btn btn-pickup" data-id="${esc(o.id)}" onclick="updateStatus(this.dataset.id, 'pickedup')">✅ Mark as Picked Up</button>`;
    } else if (o.status === "pickedup" || o.status === "picked_up") {
      actionBtn = `<button class="action-btn btn-deliver" data-id="${esc(o.id)}" onclick="updateStatus(this.dataset.id, 'delivered')">🏠 Mark as Delivered</button>`;
    }
  } else {
    actionBtn = `<button class="action-btn btn-done" disabled>✓ Delivered</button>`;
  }

  const time = new Date(o.created_at).toLocaleTimeString("en-IN", {hour:"2-digit", minute:"2-digit"});
  const date = new Date(o.created_at).toLocaleDateString("en-IN");
  const pay = String(o.payment || "cod");

  return `
    <div class="order-card">
      <div class="order-card-header">
        <div>
          <div class="order-id">#${esc(o.id)}</div>
          <div class="order-time">${date} · ${time}</div>
        </div>
        <span class="status-badge ${statusClass}">${statusLabel}</span>
      </div>
      <div class="order-items">${itemRows}</div>
      <div class="order-footer">
        <div class="order-meta">
          <span class="meta-pill meta-total">₹${esc(o.total)}</span>
          <span class="meta-pill meta-payment">${pay === "cod" ? "💵 Collect: cash or UPI" : "📱 " + esc(pay.toUpperCase())}</span>
          <span class="meta-pill meta-slot">🕐 ${esc(o.delivery_slot || "Standard")}</span>
        </div>
        ${mapsLinks}
        ${addressLine}
        ${actionBtn}
      </div>
    </div>
  `;
}

// ── LIVE GPS TRACKING ──
// While an order is picked up, its customer sees the rider's position, sent every 5 seconds.
// A web app can only do this while it's open on screen, so the screen is kept on during deliveries.
const trackingIds = new Set();
let trackTimer = null, wakeLock = null;

function pushLocation() {
  if (!currentDeliveryBoy || !trackingIds.size || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    trackingIds.forEach(id => call("rider_set_location", { p_id: id, p_lat: lat, p_lon: lon }).catch(() => {}));
  }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}

async function keepScreenOn(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) {}
}

function startRiderTracking(orderId) {
  if (!navigator.geolocation || trackingIds.has(orderId)) return;
  trackingIds.add(orderId);
  pushLocation();
  if (!trackTimer) trackTimer = setInterval(pushLocation, 5000);
  keepScreenOn(true);
  document.getElementById("liveStrip").classList.add("show");
}

function stopRiderTracking(orderId) {
  if (orderId) trackingIds.delete(orderId); else trackingIds.clear();
  if (trackingIds.size) return;
  clearInterval(trackTimer); trackTimer = null;
  keepScreenOn(false);
  // The last position stays saved; the customer's map stops showing it once the order is delivered
  document.getElementById("liveStrip").classList.remove("show");
}

// Back in the app (for example after Google Maps): send the position at once and keep the screen on again
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && trackingIds.size) { pushLocation(); keepScreenOn(true); }
});

async function updateStatus(orderId, newStatus) {
  let r = null;
  try { r = await call("rider_set_status", { p_id: orderId, p_status: newStatus }); } catch (e) { if (e.message === "session") return; }
  if (!r || !r.ok) {
    alert(r && r.error === "bad_status" ? "This order has changed. Showing the latest." : "Failed to update. Try again.");
    await loadOrders();
    return;
  }
  // Start sharing location when picked up, stop when delivered
  if (newStatus === "pickedup") startRiderTracking(orderId);
  else if (newStatus === "delivered") stopRiderTracking(orderId);
  await loadOrders();
}

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  document.getElementById("section-" + tab).classList.add("active");
}

// ── INSTALL AS AN APP ──
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let installPrompt = null;
function showInstall(ios) {
  if (isStandalone()) return;
  try { if (localStorage.getItem("rh_install_hidden") === "1") return; } catch (e) {}
  document.getElementById("installBtn").style.display = ios ? "none" : "";
  if (ios) document.getElementById("installTxt").innerHTML = "<b>Install the delivery app</b><br>Tap Share <span aria-hidden='true'>⬆️</span>, then “Add to Home Screen”.";
  document.getElementById("installBar").classList.add("show");
}
function hideInstall(forGood) {
  document.getElementById("installBar").classList.remove("show");
  if (forGood) try { localStorage.setItem("rh_install_hidden", "1"); } catch (e) {}
}
async function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  try { await installPrompt.userChoice; } catch (e) {}
  installPrompt = null;
  hideInstall(false);
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; showInstall(false); }); // Android
window.addEventListener("appinstalled", () => hideInstall(true));
if (isIOS && !isStandalone()) showInstall(true); // iPhone has no install button: show how
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/delivery-sw.js", { scope: "/delivery" }).catch(() => {});

// ── ORDER ALERTS ──
// A notification the moment an order is assigned to this rider (or cancelled), even with the app closed.
// The database sends it (see supabase/9_rider_alerts.sql); delivery-sw.js shows it. iPhone: Home Screen app only.
const PUSH_FN = SUPABASE_URL + "/functions/v1/send-push";
const keyBytes = b64 => { const s = String(b64).replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(s + "===".slice((s.length + 3) % 4)); return Uint8Array.from(bin, ch => ch.charCodeAt(0)); };
const sameKey = (buf, bytes) => { if (!buf) return false; const a = new Uint8Array(buf); return a.length === bytes.length && a.every((x, i) => x === bytes[i]); };

function alertsSupport() {
  if (isIOS) {
    const m = /OS (\d+)_(\d+)/.exec(navigator.userAgent);
    if (m && (+m[1] < 16 || (+m[1] === 16 && +m[2] < 4))) return "no";
    if (!isStandalone()) return "ios-install";
  }
  return window.isSecureContext && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window ? "yes" : "no";
}
async function currentRiderSub() {
  const reg = await navigator.serviceWorker.getRegistration("/delivery");
  return reg ? reg.pushManager.getSubscription() : null;
}
async function alertState() { // on | off | blocked | ios-install | no
  const s = alertsSupport();
  if (s !== "yes") return s;
  let p = "default";
  try { p = Notification.permission; } catch (e) {}
  if (p === "denied") return "blocked";
  if (p !== "granted") return "off";
  try { return (await currentRiderSub()) ? "on" : "off"; } catch (e) { return "off"; }
}
async function showAlertStrip() {
  const st = await alertState();
  const strip = document.getElementById("alertStrip");
  strip.className = "alert-strip" + (st === "no" ? "" : " show") + (st === "on" ? " on" : "");
  document.getElementById("alertBtn").style.display = st === "off" ? "" : "none";
  document.getElementById("alertTxt").innerHTML = {
    off: "<b>🔔 Turn on order alerts</b><br>Get a notification the moment an order is assigned to you.",
    on: "🔔 Order alerts are on. You'll get a notification for every new order.",
    blocked: "<b>🔕 Order alerts are blocked</b><br>Allow notifications for this app in your phone settings to get new orders.",
    "ios-install": "<b>🔔 Order alerts on iPhone</b><br>Add this app to your Home Screen first (Share ⬆️ → Add to Home Screen), then open it from there.",
  }[st] || "";
  return st;
}
async function turnOnOrderAlerts() {
  const btn = document.getElementById("alertBtn");
  btn.disabled = true; btn.textContent = "Turning on…";
  try {
    const p = await Notification.requestPermission(); // straight from the tap: phones only ask right after one
    if (p === "granted") {
      await navigator.serviceWorker.register("/delivery-sw.js", { scope: "/delivery" });
      const reg = await navigator.serviceWorker.ready;
      let key = await rpc("push_public_key", {}).catch(() => null);
      if (!key) key = (await fetch(PUSH_FN).then(r => r.json()).catch(() => ({}))).publicKey;
      if (!key) throw new Error("no key");
      const bytes = keyBytes(key);
      let sub = await reg.pushManager.getSubscription();
      if (sub && !sameKey(sub.options && sub.options.applicationServerKey, bytes)) { await sub.unsubscribe().catch(() => {}); sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
      const r = await call("rider_push_subscribe", { p_sub: sub.toJSON() });
      if (!r || !r.ok) throw new Error((r && r.error) || "not saved");
    }
  } catch (e) {
    if (e.message !== "session") alert("Couldn't turn on order alerts. Check your internet and try again.");
  }
  btn.disabled = false; btn.textContent = "Turn on";
  showAlertStrip();
}
// already on: keep this phone linked to whoever is logged in
async function refreshOrderAlerts() {
  try {
    if (alertsSupport() !== "yes" || Notification.permission !== "granted") return;
    const sub = await currentRiderSub();
    if (sub) await call("rider_push_subscribe", { p_sub: sub.toJSON() });
  } catch (e) {}
}
async function stopOrderAlerts(token) {
  try {
    const sub = await currentRiderSub();
    if (!sub) return;
    const endpoint = sub.endpoint;
    await sub.unsubscribe().catch(() => {});
    await rpc("rider_push_unsubscribe", { p_token: token, p_endpoint: endpoint }).catch(() => {});
  } catch (e) {}
}
// an alert arrived or was tapped: show the latest orders now
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "rh-refresh") loadOrders(); });

// ── RESTORE SESSION ──
window.onload = async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("rh_rider") || "null"); } catch (e) {}
  if (!saved || !saved.token) return;
  currentDeliveryBoy = saved;
  try {
    const me = await rpc("staff_me", { p_token: saved.token });
    if (!me.ok || me.kind !== "rider") { doLogout("Please log in again."); return; }
    currentDeliveryBoy.name = me.name || saved.name;
  } catch (e) {} // offline: open with what we have; loading orders will say if it can't
  showPanel();
};
</script>
